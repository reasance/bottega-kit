name: Publish npm

# Publishes the bottega-kit npm wrapper whenever a release tag
# (bottega-kit--v*) is pushed. The package is the thin installer wrapper only:
# `npx bottega-kit` clones this repository at the tag matching its own
# version and runs ./install.sh, so the npm package and the git release
# describe the same version by construction.
#
# No secret: npm trusted publishing. The package's Trusted Publisher on
# npmjs.com names reasance/bottega-kit and this file, publish-npm.yml; npm
# trades the runner's OIDC identity for a short-lived credential and attaches
# a provenance statement.

on:
  push:
    tags: ['bottega-kit--v*']
  # A manual re-run publishes whatever main's package.json says, so a publish
  # can be retried after a workflow fix without moving the tag.
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing and provenance both use the runner's OIDC identity;
  # provenance needs package.json's repository to name this repository.
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard — tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#bottega-kit--v}"
          VERSION="$(jq -r '.version' package.json)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag bottega-kit--v$TAG does not match package.json $VERSION"; exit 1
          fi

      # actions/checkout leaves a lightweight ref even for an annotated tag,
      # so the real tag object is fetched before the annotation rule is checked.
      - name: Guard — version surfaces and tag rules (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --depth=1 origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          bash tests/version-consistency.sh --tag "${GITHUB_REF_NAME}"

      - name: Guard — version surfaces (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: bash tests/version-consistency.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later. Pinned: this job can
      # publish, so it never installs an unpinned npm.
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.2

      - name: Wrapper tests
        run: node --test tests/npm-installer.test.mjs

      - name: Guard — the version must not be on npm already
        run: |
          VERSION="$(jq -r '.version' package.json)"
          if npm view "bottega-kit@$VERSION" version >/dev/null 2>&1; then
            echo "bottega-kit@$VERSION is already published"; exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
